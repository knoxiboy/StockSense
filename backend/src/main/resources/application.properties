spring.application.name=stocksense-backend

# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stocksense}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Logging
logging.level.com.stocksense=INFO

# Spring Mail / SMTP Configuration (supports both MAIL_* and SPRING_MAIL_* environment variables)
spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:localhost}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:${SPRING_MAIL_SMTP_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:${SPRING_MAIL_STARTTLS_ENABLE:true}}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# StockSense Mail Sender and Delivery Mode (smtp in production/default, console for explicit test/dev)
stocksense.mail.from=${MAIL_FROM:${SPRING_MAIL_FROM:noreply@stocksense.io}}
stocksense.mail.delivery-mode=${STOCKSENSE_MAIL_DELIVERY_MODE:smtp}

# StockSense Security & Auth Configuration
stocksense.jwt.secret=${JWT_SECRET:StockSenseSuperSecretSigningKeyForJwtTokens2026!#}

# Optional Initial Manager Bootstrap (Only created once if configured and no manager exists)
stocksense.initial-manager.email=${STOCKSENSE_INITIAL_MANAGER_EMAIL:}
stocksense.initial-manager.password=${STOCKSENSE_INITIAL_MANAGER_PASSWORD:}
stocksense.initial-manager.name=${STOCKSENSE_INITIAL_MANAGER_NAME:System Administrator}
