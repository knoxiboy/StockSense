spring.application.name=stocksense-backend-test

# In-memory H2 configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test email and auth configuration
stocksense.mail.delivery-mode=console
stocksense.jwt.secret=StockSenseSuperSecretSigningKeyForJwtTokens2026!#
